name: Cập nhật số liệu từ Google Sheet

# Chạy MỖI GIỜ trong giờ hành chính: 8h07 → 18h07 giờ Việt Nam, thứ 2 đến thứ 6.
# GitHub dùng giờ UTC nên trừ 7 tiếng: 1h–11h UTC. Phút 07 thay vì 00 vì đúng đầu giờ
# hàng loạt workflow của cả thế giới cùng chạy, GitHub hay đẩy lịch trễ.
# Ngoài khung này (buổi tối, cuối tuần) bấm tay bất cứ lúc nào: Actions → "Run workflow".
on:
  schedule:
    - cron: "7 1-11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write          # cần quyền này để Action commit lại index.html

concurrency:
  group: cap-nhat-so-lieu
  cancel-in-progress: false

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kiểm tra đã khai báo file nhập liệu chưa
        run: |
          if [ -z "${{ vars.NHAP_LIEU_SHEET_ID }}" ]; then
            echo "::warning::CHƯA KHAI BÁO biến NHAP_LIEU_SHEET_ID — nội dung Phòng nhập trên Google Sheet sẽ KHÔNG được cập nhật. Vào Settings → Secrets and variables → Actions → tab Variables → New repository variable, tên NHAP_LIEU_SHEET_ID."
          else
            echo "OK: đã khai báo NHAP_LIEU_SHEET_ID"
          fi

      - name: Lấy số từ Google Sheet và ghi vào index.html
        env:
          # ID file "Nhập liệu báo cáo tháng" cả Phòng cùng điền.
          # Khai báo ở Settings → Secrets and variables → Actions → Variables → New variable
          # với tên NHAP_LIEU_SHEET_ID. Chưa khai báo thì chỉ cập nhật số doanh thu.
          NHAP_LIEU_SHEET_ID: ${{ vars.NHAP_LIEU_SHEET_ID }}
        run: python tools/update_data.py index.html

      - name: Commit nếu số liệu có thay đổi
        run: |
          if [ -z "$(git status --porcelain index.html)" ]; then
            echo "Số liệu không đổi — bỏ qua commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Cập nhật số liệu TripCARE & wBooking từ Google Sheet"
          git push
